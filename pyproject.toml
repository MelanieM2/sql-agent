[project]
name = "sql-agent"
version = "0.1.0"
description = "Agentic SQL assistant — natural language queries over SQLite via Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.9.0",
    "python-dotenv==1.2.2",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days ago"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
